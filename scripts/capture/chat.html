<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/media/chat.css">
<script>
let saved = null;
window.sent = [];
window.acquireVsCodeApi = () => ({
  postMessage: (m) => { window.sent.push(m); parent.postMessage({ demo: 'chatSent', msg: m }, '*'); },
  getState: () => saved,
  setState: (s) => { saved = s; },
});
</script></head>
<body class="vscode-dark"><script src="/media/markdown.js"></script><script src="/media/chat.js"></script></body></html>
